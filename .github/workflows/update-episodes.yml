name: Update episodes

# 配信は毎週土曜19:00(JST)。少し遅らせて土曜21:00(JST)=12:00 UTCに実行する。
on:
  schedule:
    - cron: "0 12 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Update data/episodes.json
        run: python3 scripts/update_episodes.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data/episodes.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json
          git commit -m "episodes.json を自動更新"
          git push
