name: Update episodes

# 配信は毎週土曜19:00(JST)。配信直後にApple側の一覧へ反映されていない場合や、定期実行が遅れた場合に
# 取りこぼさないよう、土曜21:00・日曜9:00・月曜9:00(いずれもJST)の3回実行する。
# 更新がなければコミットしないので、余分に動いても害はない。cron は UTC で書く。
on:
  schedule:
    - cron: "0 12 * * 6"   # 土曜 21:00 JST
    - cron: "0 0 * * 0"    # 日曜  9:00 JST
    - cron: "0 0 * * 1"    # 月曜  9:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Update data/episodes.json
        run: python3 scripts/update_episodes.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data/episodes.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json
          git commit -m "episodes.json を自動更新"
          git push
